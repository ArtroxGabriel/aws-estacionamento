apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-data
  namespace: estacionamento
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: estacionamento
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: estacionamento
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: estacionamento
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbitmq
        app.kubernetes.io/part-of: estacionamento
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management-alpine
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          env:
            # O nome do nó vai para o caminho dos dados (mnesia/rabbit@<host>). Fixo,
            # para as filas sobreviverem à troca de pod, que muda o hostname.
            - name: RABBITMQ_NODENAME
              value: rabbit@localhost
          # `ping` responde antes de a porta AMQP aceitar conexões (ver o compose).
          readinessProbe:
            exec:
              command: [rabbitmq-diagnostics, -q, check_port_connectivity]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: [rabbitmq-diagnostics, -q, ping]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
            - name: config
              mountPath: /etc/rabbitmq/conf.d/20-definitions.conf
              subPath: 20-definitions.conf
              readOnly: true
            - name: definitions
              mountPath: /etc/rabbitmq/definitions.json
              subPath: definitions.json
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rabbitmq-data
        - name: config
          configMap:
            name: rabbitmq-config
        - name: definitions
          secret:
            secretName: rabbitmq-definitions
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: estacionamento
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: estacionamento
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
---
# Painel de gerenciamento para fora do cluster: http://<ip-do-nó>:31672
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-management
  namespace: estacionamento
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: estacionamento
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - name: management
      port: 15672
      targetPort: management
      nodePort: 31672
