apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: estacionamento
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: estacionamento
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: estacionamento
    spec:
      containers:
        - name: web
          # Imagem local (task k8s:build); a de produção viria de um registry.
          image: estacionamento-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            # O nginx encaminha /api/ para o Service da API.
            - name: API_UPSTREAM
              value: http://api:8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
---
# Acesso de fora do cluster: http://<ip-do-nó>:30080
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: estacionamento
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: estacionamento
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
