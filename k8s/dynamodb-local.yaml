apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dynamodb-data
  namespace: estacionamento
  labels:
    app.kubernetes.io/name: dynamodb-local
    app.kubernetes.io/part-of: estacionamento
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamodb-local
  namespace: estacionamento
  labels:
    app.kubernetes.io/name: dynamodb-local
    app.kubernetes.io/part-of: estacionamento
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dynamodb-local
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dynamodb-local
        app.kubernetes.io/part-of: estacionamento
    spec:
      containers:
        - name: dynamodb-local
          image: amazon/dynamodb-local:latest
          args: [-jar, DynamoDBLocal.jar, -sharedDb, -dbPath, ./data]
          ports:
            - name: dynamodb
              containerPort: 8000
          readinessProbe:
            tcpSocket:
              port: dynamodb
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: dynamodb
            initialDelaySeconds: 30
            periodSeconds: 20
          # Root com as capabilities padrão, como no compose (`user: root`): sem DAC_OVERRIDE
          # o root não lê o jar do usuário dynamodblocal.
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
          volumeMounts:
            - name: data
              mountPath: /home/dynamodblocal/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dynamodb-data
---
apiVersion: v1
kind: Service
metadata:
  name: dynamodb-local
  namespace: estacionamento
  labels:
    app.kubernetes.io/name: dynamodb-local
    app.kubernetes.io/part-of: estacionamento
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dynamodb-local
  ports:
    - name: dynamodb
      port: 8000
      targetPort: dynamodb
