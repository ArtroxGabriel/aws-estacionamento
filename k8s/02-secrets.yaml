# Credenciais de desenvolvimento, as mesmas do infra/docker-compose.yaml. Nenhuma
# fica em ConfigMap: os pods as recebem por secretKeyRef e montam as URLs de
# conexão no próprio pod. Fora de uma demonstração, não versione este arquivo:
# crie os Secrets com `kubectl create secret` (ver k8s/README.md).
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: estacionamento
  labels:
    app.kubernetes.io/part-of: estacionamento
type: Opaque
stringData:
  POSTGRES_USER: app_user
  POSTGRES_PASSWORD: app_password
  POSTGRES_DB: estacionamento
---
apiVersion: v1
kind: Secret
metadata:
  name: rustfs-credentials
  namespace: estacionamento
  labels:
    app.kubernetes.io/part-of: estacionamento
type: Opaque
stringData:
  RUSTFS_ACCESS_KEY: rustfsadmin
  RUSTFS_SECRET_KEY: rustfsadmin
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-credentials
  namespace: estacionamento
  labels:
    app.kubernetes.io/part-of: estacionamento
type: Opaque
stringData:
  RABBITMQ_USER: guest
  RABBITMQ_PASSWORD: guest
---
# Mesmo conteúdo de infra/rabbitmq/definitions.json (vhost, usuário, filas).
# O usuário e a senha daqui precisam ser iguais aos de `rabbitmq-credentials`.
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-definitions
  namespace: estacionamento
  labels:
    app.kubernetes.io/part-of: estacionamento
type: Opaque
stringData:
  definitions.json: |
    {
      "vhosts": [{ "name": "/" }],
      "users": [{ "name": "guest", "password": "guest", "tags": ["administrator"] }],
      "permissions": [
        { "user": "guest", "vhost": "/", "configure": ".*", "write": ".*", "read": ".*" }
      ],
      "queues": [
        {
          "name": "ocr-processamento-fila",
          "vhost": "/",
          "durable": true,
          "auto_delete": false,
          "arguments": {
            "x-dead-letter-exchange": "",
            "x-dead-letter-routing-key": "ocr-processamento-fila-dlq"
          }
        },
        {
          "name": "ocr-processamento-fila-retry",
          "vhost": "/",
          "durable": true,
          "auto_delete": false,
          "arguments": {
            "x-message-ttl": 30000,
            "x-dead-letter-exchange": "",
            "x-dead-letter-routing-key": "ocr-processamento-fila"
          }
        },
        {
          "name": "ocr-processamento-fila-dlq",
          "vhost": "/",
          "durable": true,
          "auto_delete": false,
          "arguments": {}
        }
      ]
    }
