# Equivalentes dos serviços `createbuckets` e `createtables` do compose: rodam uma
# vez, esperam o serviço responder e criam o bucket e a tabela de auditoria se
# faltarem. A API e o worker só sobem depois (initContainer `wait-for-deps`).
apiVersion: batch/v1
kind: Job
metadata:
  name: create-bucket
  namespace: estacionamento
  labels:
    app.kubernetes.io/name: create-bucket
    app.kubernetes.io/part-of: estacionamento
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: create-bucket
        app.kubernetes.io/part-of: estacionamento
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-bucket
          image: amazon/aws-cli:latest
          command: [/bin/sh, -c]
          args:
            - |
              until aws s3api list-buckets --endpoint-url "$S3_ENDPOINT_URL" >/dev/null 2>&1; do
                echo "waiting for $S3_ENDPOINT_URL"; sleep 2
              done
              aws s3api head-bucket --endpoint-url "$S3_ENDPOINT_URL" --bucket "$S3_BUCKET_NAME" >/dev/null 2>&1 ||
                aws s3api create-bucket --endpoint-url "$S3_ENDPOINT_URL" --bucket "$S3_BUCKET_NAME"
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: rustfs-credentials
                  key: RUSTFS_ACCESS_KEY
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-credentials
                  key: RUSTFS_SECRET_KEY
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: create-table
  namespace: estacionamento
  labels:
    app.kubernetes.io/name: create-table
    app.kubernetes.io/part-of: estacionamento
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: create-table
        app.kubernetes.io/part-of: estacionamento
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-table
          image: amazon/aws-cli:latest
          command: [/bin/sh, -c]
          args:
            - |
              until aws dynamodb list-tables --endpoint-url "$DYNAMODB_ENDPOINT_URL" >/dev/null 2>&1; do
                echo "waiting for $DYNAMODB_ENDPOINT_URL"; sleep 2
              done
              aws dynamodb describe-table --endpoint-url "$DYNAMODB_ENDPOINT_URL" --table-name "$DYNAMODB_TABLE_NAME" >/dev/null 2>&1 ||
                aws dynamodb create-table --endpoint-url "$DYNAMODB_ENDPOINT_URL" \
                  --table-name "$DYNAMODB_TABLE_NAME" \
                  --attribute-definitions AttributeName=id,AttributeType=S \
                  --key-schema AttributeName=id,KeyType=HASH \
                  --billing-mode PAY_PER_REQUEST
          envFrom:
            - configMapRef:
                name: app-config
          env:
            # O DynamoDB Local aceita qualquer credencial.
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: AWS_ACCESS_KEY_ID
              value: local
            - name: AWS_SECRET_ACCESS_KEY
              value: local
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
