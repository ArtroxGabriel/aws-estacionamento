apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: estacionamento
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: estacionamento
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: estacionamento
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: estacionamento
spec:
  replicas: 1
  # Um volume ReadWriteOnce: o pod novo só sobe depois de o antigo sair.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: estacionamento
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-credentials
          env:
            # Subdiretório: a raiz do volume pode vir com lost+found e o initdb recusa.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: [sh, -c, 'pg_isready -h localhost -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: [sh, -c, 'pg_isready -h localhost -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: estacionamento
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: estacionamento
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
