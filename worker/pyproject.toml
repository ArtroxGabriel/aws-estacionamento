[project]
name = "ocr-worker"
version = "0.1.0"
description = "Asynchronous Python OCR worker for the AWS parking-lot system"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.35",
    "pytesseract>=0.3.13",
    "Pillow>=11.0",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.115",
    "moto[s3,sqs,dynamodb]>=5.0",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "W",   # pycodestyle warnings
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
