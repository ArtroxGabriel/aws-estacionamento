services:
  floci:
    image: floci/floci:latest
    container_name: floci_aws
    ports:
      - "4566:4566"             # Floci Gateway (S3, SQS, SNS, DynamoDB, RDS, ElastiCache)
      - "5432-5440:5432-5440"   # RDS proxy ports (PostgreSQL)
      - "6379-6399:6379-6399"   # ElastiCache proxy ports (Redis)
    environment:
      - AWS_DEFAULT_REGION=us-east-1
      - FLOCI_STORAGE_MODE=persistent
      - FLOCI_STORAGE_PERSISTENT_PATH=/app/data
      - FLOCI_SERVICES_DOCKER_NETWORK=estacionamento_network
      - FLOCI_SERVICES_RDS_PROXY_BASE_PORT=5432
      - FLOCI_SERVICES_RDS_PROXY_MAX_PORT=5440
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - floci_data:/app/data
    healthcheck:
      test: ["CMD", "bash", "-c", "(echo > /dev/tcp/127.0.0.1/4566) >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  floci_data:

networks:
  default:
    name: estacionamento_network
