services:
  postgres:
    image: postgres:16-alpine
    container_name: estacionamento_postgres
    environment:
      POSTGRES_DB: estacionamento
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: estacionamento_redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: estacionamento_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - '5672:5672'
      - '15672:15672'
    # `ping` responde antes de a porta AMQP aceitar conexões; quem dependia dele
    # (API e worker) tomava "connection refused" na subida.
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_port_connectivity']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-definitions.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro

  rustfs:
    image: rustfs/rustfs:latest
    container_name: estacionamento_rustfs
    user: root
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      - RUSTFS_VOLUMES=/data/rustfs0
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_ACCESS_KEY=minioadmin
      - RUSTFS_SECRET_KEY=minioadmin
    volumes:
      - rustfs_data:/data/rustfs0
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  createbuckets:
    image: minio/mc:latest
    container_name: estacionamento_createbuckets
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myrustfs http://rustfs:9000 minioadmin minioadmin;
      mc mb myrustfs/estacionamento-fotos-veiculos-local --ignore-existing;
      exit 0;
      "

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: estacionamento_dynamodb
    user: root
    command: '-jar DynamoDBLocal.jar -sharedDb -dbPath ./data'
    ports:
      - '8000:8000'
    volumes:
      - dynamodb_data:/home/dynamodblocal/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -s http://localhost:8000 >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  createtables:
    image: amazon/aws-cli:latest
    container_name: estacionamento_createtables
    depends_on:
      dynamodb-local:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      aws dynamodb describe-table --endpoint-url http://dynamodb-local:8000 --table-name AuditoriaEstacionamento >/dev/null 2>&1 ||
      aws dynamodb create-table --endpoint-url http://dynamodb-local:8000
      --table-name AuditoriaEstacionamento
      --attribute-definitions AttributeName=id,AttributeType=S
      --key-schema AttributeName=id,KeyType=HASH
      --billing-mode PAY_PER_REQUEST;
      exit 0;
      "

  # API Go: aplica as migrations do Postgres na subida, cria o bucket se faltar e
  # publica as tarefas de OCR no RabbitMQ. A imagem é FROM scratch (sem shell),
  # então não há healthcheck; o `web` espera só o container iniciar.
  api:
    build:
      context: ../api
    image: estacionamento-api
    container_name: estacionamento_api
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      S3_ENDPOINT_URL: http://rustfs:9000
      S3_BUCKET_NAME: estacionamento-fotos-veiculos-local
      DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
      DYNAMODB_TABLE_NAME: AuditoriaEstacionamento
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      RABBITMQ_QUEUE_NAME: ocr-processamento-fila
      DATABASE_URL: postgres://app_user:app_password@postgres:5432/estacionamento?sslmode=disable
      REDIS_URL: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      dynamodb-local:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
      createtables:
        condition: service_completed_successfully

  # Frontend: nginx servindo o React e encaminhando /api/ para a API.
  web:
    build:
      context: ../web
    image: estacionamento-web
    container_name: estacionamento_web
    restart: unless-stopped
    ports:
      - '3000:80'
    environment:
      API_UPSTREAM: http://api:8080
    depends_on:
      api:
        condition: service_started

  worker:
    build:
      context: ../worker
    image: estacionamento-worker
    container_name: estacionamento_worker
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      S3_ENDPOINT_URL: http://rustfs:9000
      S3_BUCKET_NAME: estacionamento-fotos-veiculos-local
      DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
      DYNAMODB_TABLE_NAME: AuditoriaEstacionamento
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      RABBITMQ_QUEUE_NAME: ocr-processamento-fila
      DATABASE_URL: postgresql://app_user:app_password@postgres:5432/estacionamento
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      dynamodb-local:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
      createtables:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  rustfs_data:
  dynamodb_data:

networks:
  default:
    name: estacionamento_network
