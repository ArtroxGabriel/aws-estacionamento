name: Deploy AWS

# Roda sob demanda (Actions → Deploy AWS → Run workflow).
# Pré-requisitos (uma vez): `task aws:bootstrap` na conta e, no GitHub, o
# environment "aws" com a variável AWS_ROLE_ARN (output deploy_role_arn).
on:
  workflow_dispatch:
    inputs:
      action:
        description: "apply = build das imagens + deploy; plan = só mostra o plano; destroy = apaga a infra (mantém o bootstrap)"
        type: choice
        options: [apply, plan, destroy]
        default: apply

permissions:
  contents: read
  id-token: write # token OIDC para assumir a role na AWS

# Um deploy por vez; nunca cancela um apply no meio.
concurrency:
  group: deploy-aws
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  IMAGE_TAG: ${{ github.sha }}

jobs:
  plan:
    if: inputs.action == 'plan'
    runs-on: ubuntu-latest
    environment: aws
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/tofu-aws
        with:
          role-arn: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: tofu plan
        working-directory: infra/aws
        run: tofu plan -input=false -var="image_tag=$IMAGE_TAG"

  apply:
    if: inputs.action == 'apply'
    runs-on: ubuntu-latest
    environment: aws
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: tofu
        uses: ./.github/actions/tofu-aws
        with:
          role-arn: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Os repositórios precisam existir antes do push das imagens.
      - name: Repositórios ECR
        working-directory: infra/aws
        run: tofu apply -input=false -auto-approve -target=module.app.aws_ecr_repository.app

      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Imagem api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./api
          platforms: linux/amd64
          provenance: false
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/estacionamento-api:${{ env.IMAGE_TAG }}
            ${{ steps.ecr.outputs.registry }}/estacionamento-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Imagem worker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./worker
          platforms: linux/amd64
          provenance: false
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/estacionamento-worker:${{ env.IMAGE_TAG }}
            ${{ steps.ecr.outputs.registry }}/estacionamento-worker:latest
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max

      - name: Imagem web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./web
          platforms: linux/amd64
          provenance: false
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/estacionamento-web:${{ env.IMAGE_TAG }}
            ${{ steps.ecr.outputs.registry }}/estacionamento-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      # Tag nova no launch template = instance refresh automático no ASG.
      - name: tofu apply
        working-directory: infra/aws
        run: tofu apply -input=false -auto-approve -var="image_tag=$IMAGE_TAG"

      - name: Aguarda o instance refresh
        working-directory: infra/aws
        run: |
          ASG=$(tofu output -raw asg_name)
          for _ in $(seq 1 60); do
            STATUS=$(aws autoscaling describe-instance-refreshes --auto-scaling-group-name "$ASG" \
              --max-records 1 --query 'InstanceRefreshes[0].Status' --output text)
            echo "instance refresh: $STATUS"
            case "$STATUS" in
              Successful|None) exit 0 ;;
              Failed|Cancelled|RollbackSuccessful|RollbackFailed) exit 1 ;;
            esac
            sleep 20
          done
          echo "Instance refresh não terminou em 20 min"
          exit 1

      - name: Health check pelo ALB
        working-directory: infra/aws
        run: |
          curl -fsS --retry 20 --retry-delay 15 --retry-all-errors "$(tofu output -raw alb_url)/api/health"
          {
            echo "### Deploy concluído"
            echo ""
            echo "- Aplicação: $(tofu output -raw app_url)"
            echo "- ALB (teste de carga): $(tofu output -raw alb_url)"
            echo "- Imagens: \`$IMAGE_TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"

  destroy:
    if: inputs.action == 'destroy'
    runs-on: ubuntu-latest
    environment: aws
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/tofu-aws
        with:
          role-arn: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: tofu destroy
        working-directory: infra/aws
        run: tofu destroy -input=false -auto-approve
