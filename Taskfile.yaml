version: "3"

vars:
  ENV_FILE: .env
  TERRAFORM_DIR: infra
  AWS_TF_DIR: infra/aws
  BOOTSTRAP_DIR: infra/bootstrap
  API_DIR: api
  WORKER_DIR: worker
  WEB_DIR: web
  DOCKER_COMPOSE_FILE: "{{.TERRAFORM_DIR}}/docker-compose.yaml"
  K8S_DIR: k8s
  K8S_NAMESPACE: estacionamento
  # Perfil do Colima com k3s: gera o contexto do kubectl e o do Docker `colima-k3s`.
  K3S_PROFILE: k3s
  K8S_CONTEXT: colima-k3s
  K8S_DOCKER_CONTEXT: colima-k3s
  AWS_REGION_REAL: us-east-1
  ASG_NAME: estacionamento-asg
  # O .env aponta AWS_ENDPOINT_URL para o Floci e usa chaves falsas; o AWS CLI e
  # o provider do OpenTofu leem essas variáveis. As tasks da AWS real começam
  # com este trecho para descartá-las e usar ~/.aws/credentials (ou o ambiente).
  AWS_REAL: |
    if [ "$AWS_ACCESS_KEY_ID" = "mock_key" ]; then unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; fi
    case "$AWS_ENDPOINT_URL" in *localhost*|*127.0.0.1*|*floci*) unset AWS_ENDPOINT_URL;; esac

dotenv: [".env"]

tasks:
  default:
    desc: Lista os comandos disponíveis
    cmds:
      - task --list

  up:
    desc: "Sobe o sistema inteiro e reconstrói as imagens. Auditoria no DynamoDB real se infra/.env tiver DYNAMODB_ACCESS_KEY_ID; senão, DynamoDB Local. Web em http://localhost:3000"
    cmds:
      - |
        ENV_FILE="$(dirname {{.DOCKER_COMPOSE_FILE}})/.env"
        if grep -qE '^DYNAMODB_ACCESS_KEY_ID=.+' "$ENV_FILE" 2>/dev/null; then
          echo ">> Auditoria: DynamoDB real (credenciais em $ENV_FILE)"
          export DYNAMODB_ENDPOINT_URL=
        else
          echo ">> Auditoria: DynamoDB Local"
          export DYNAMODB_ENDPOINT_URL=http://dynamodb-local:8000
          export DYNAMODB_ACCESS_KEY_ID= DYNAMODB_SECRET_ACCESS_KEY= DYNAMODB_SESSION_TOKEN=
        fi
        docker compose -f {{.DOCKER_COMPOSE_FILE}} up -d --build
        # A API pode ter ganhado outro IP; o nginx do web só resolve o DNS ao iniciar.
        docker compose -f {{.DOCKER_COMPOSE_FILE}} restart web

  down:
    desc: Encerra o sistema inteiro (os volumes com os dados ficam)
    cmds:
      - docker compose -f {{.DOCKER_COMPOSE_FILE}} down

  logs:
    desc: Acompanha os logs de todos os serviços
    cmds:
      - docker compose -f {{.DOCKER_COMPOSE_FILE}} logs -f

  test:
    desc: Executa os testes da API, do worker e do frontend
    cmds:
      - task: test:api
      - task: test:worker
      - task: test:web

  infra:up:
    desc: Sobe só as dependências locais (Postgres, Redis, RabbitMQ, RustFS, DynamoDB Local), para rodar API e worker com dev:*
    cmds:
      - docker compose -f {{.DOCKER_COMPOSE_FILE}} up -d postgres redis rabbitmq rustfs createbuckets dynamodb-local createtables

  infra:down:
    desc: Encerra os containers locais
    cmds:
      - docker compose -f {{.DOCKER_COMPOSE_FILE}} down

  infra:logs:
    desc: Acompanha os logs dos containers locais
    cmds:
      - docker compose -f {{.DOCKER_COMPOSE_FILE}} logs -f

  k8s:k3s:up:
    desc: "Sobe um cluster k3s local (Colima, perfil k3s: 4 CPUs, 6 GiB) para testar os manifestos de k8s/"
    cmds:
      - colima start --profile {{.K3S_PROFILE}} --kubernetes --runtime docker --cpu 4 --memory 6 --disk 40

  k8s:k3s:down:
    desc: Para o cluster k3s local (o estado do cluster fica no disco da VM)
    cmds:
      - colima stop --profile {{.K3S_PROFILE}}

  k8s:build:
    desc: Constrói as imagens api, worker e web no Docker do k3s (o cluster as usa sem registry)
    cmds:
      - |
        for app in api worker web; do
          docker --context {{.K8S_DOCKER_CONTEXT}} build -t estacionamento-${app}:latest ./${app}
        done

  k8s:apply:
    desc: Aplica os manifestos de k8s/ e espera os Deployments ficarem prontos. Web em http://localhost:3000 (task k8s:forward)
    cmds:
      - kubectl --context {{.K8S_CONTEXT}} apply -f {{.K8S_DIR}}/
      - |
        for app in postgres redis rabbitmq rustfs dynamodb-local api worker web; do
          kubectl --context {{.K8S_CONTEXT}} -n {{.K8S_NAMESPACE}} rollout status deployment/${app} --timeout=300s
        done

  k8s:status:
    desc: Mostra pods, serviços, volumes e jobs do namespace estacionamento
    cmds:
      - kubectl --context {{.K8S_CONTEXT}} -n {{.K8S_NAMESPACE}} get pods,svc,jobs,pvc

  k8s:forward:
    desc: Expõe web (3000), painel do RabbitMQ (15672) e console do RustFS (9001) em localhost
    cmds:
      - |
        trap 'kill 0' EXIT
        kubectl --context {{.K8S_CONTEXT}} -n {{.K8S_NAMESPACE}} port-forward svc/web 3000:80 &
        kubectl --context {{.K8S_CONTEXT}} -n {{.K8S_NAMESPACE}} port-forward svc/rabbitmq-management 15672:15672 &
        kubectl --context {{.K8S_CONTEXT}} -n {{.K8S_NAMESPACE}} port-forward svc/rustfs-console 9001:9001 &
        wait

  k8s:logs:
    desc: "Acompanha os logs de um Deployment (ex.: task k8s:logs APP=worker)"
    vars:
      APP: '{{.APP | default "api"}}'
    cmds:
      - kubectl --context {{.K8S_CONTEXT}} -n {{.K8S_NAMESPACE}} logs -f deployment/{{.APP}}

  k8s:delete:
    desc: Remove o namespace estacionamento e tudo dentro dele, inclusive os volumes (apaga os dados)
    cmds:
      - kubectl --context {{.K8S_CONTEXT}} delete -f {{.K8S_DIR}}/ --ignore-not-found

  tf:clean:
    desc: Remove arquivos de estado e cache locais do OpenTofu/Terraform
    dir: "{{.TERRAFORM_DIR}}"
    cmds:
      - rm -rf .terraform .tofu .terraform.lock.hcl terraform.tfstate terraform.tfstate.backup

  infra:clean:
    desc: Remove containers, volumes, networks locais e limpa o estado do OpenTofu
    cmds:
      - docker compose -f {{.DOCKER_COMPOSE_FILE}} down -v --remove-orphans
      - task: tf:clean

  infra:clean:all:
    desc: Remove containers, volumes, networks, imagens e limpa o estado do OpenTofu
    cmds:
      - docker compose -f {{.DOCKER_COMPOSE_FILE}} down -v --remove-orphans --rmi all
      - task: tf:clean

  tf:init:
    desc: Inicializa o diretório do OpenTofu
    dir: "{{.TERRAFORM_DIR}}"
    cmds:
      - tofu init

  tf:plan:local:
    desc: Gera o plano de execução do OpenTofu apontando para o Floci
    dir: "{{.TERRAFORM_DIR}}"
    cmds:
      - tofu plan -var="use_localstack=true"

  tf:apply:local:
    desc: Provisiona recursos locais apontando para o Floci via OpenTofu
    dir: "{{.TERRAFORM_DIR}}"
    cmds:
      - tofu apply -var="use_localstack=true" -auto-approve

  aws:bootstrap:
    desc: "Uma vez por conta: bucket do state remoto + OIDC do GitHub + role de deploy (precisa de admin)"
    dir: "{{.BOOTSTRAP_DIR}}"
    cmds:
      - |
        {{.AWS_REAL}}
        tofu init -input=false
        tofu apply
        tofu output

  tf:init:aws:
    desc: Inicializa infra/aws com o state remoto no S3 (criado por aws:bootstrap)
    dir: "{{.AWS_TF_DIR}}"
    cmds:
      - |
        {{.AWS_REAL}}
        ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
        tofu init -input=false -reconfigure -backend-config="bucket=estacionamento-tofu-state-$ACCOUNT"

  tf:plan:aws:
    desc: Gera o plano de execução do OpenTofu para a AWS (state remoto)
    dir: "{{.AWS_TF_DIR}}"
    deps: [tf:init:aws]
    cmds:
      - |
        {{.AWS_REAL}}
        tofu plan

  tf:apply:aws:
    desc: Provisiona recursos reais na AWS via OpenTofu (state remoto)
    dir: "{{.AWS_TF_DIR}}"
    deps: [tf:init:aws]
    cmds:
      - |
        {{.AWS_REAL}}
        tofu apply

  tf:destroy:aws:
    desc: Destrói recursos na AWS para evitar cobrança (mantém o bootstrap)
    dir: "{{.AWS_TF_DIR}}"
    deps: [tf:init:aws]
    cmds:
      - |
        {{.AWS_REAL}}
        tofu destroy -auto-approve

  tf:refresh:
    desc: Atualiza o state remoto com os recursos reais na AWS
    dir: "{{.AWS_TF_DIR}}"
    deps: [tf:init:aws]
    cmds:
      - |
        {{.AWS_REAL}}
        tofu refresh

  tf:output:
    desc: Exibe os outputs do OpenTofu local (Floci)
    dir: "{{.TERRAFORM_DIR}}"
    cmds:
      - tofu output

  tf:output:aws:
    desc: Exibe os outputs da AWS (URL do ALB, ASG, ECR...)
    dir: "{{.AWS_TF_DIR}}"
    deps: [tf:init:aws]
    cmds:
      - |
        {{.AWS_REAL}}
        tofu output

  aws:images:
    desc: Build (linux/amd64) e push das imagens api, worker e web para o ECR
    cmds:
      - |
        {{.AWS_REAL}}
        # Não usa `tofu output`: o apply com -target do deploy:aws não grava outputs.
        ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
        REGISTRY="$ACCOUNT.dkr.ecr.{{.AWS_REGION_REAL}}.amazonaws.com"
        aws ecr get-login-password --region {{.AWS_REGION_REAL}} | docker login --username AWS --password-stdin "$REGISTRY"
        for app in api worker web; do
          docker buildx build --platform linux/amd64 --provenance=false -t "$REGISTRY/estacionamento-${app}:latest" --push "./${app}"
        done

  aws:rollout:
    desc: Recria as instâncias do ASG aos poucos para pegarem as imagens novas do ECR
    cmds:
      - |
        {{.AWS_REAL}}
        aws autoscaling start-instance-refresh --region {{.AWS_REGION_REAL}} \
          --auto-scaling-group-name {{.ASG_NAME}} --preferences MinHealthyPercentage=50

  deploy:aws:
    desc: Deploy completo na AWS pela máquina local (ECR → imagens → infraestrutura completa)
    cmds:
      - task: tf:init:aws
      - cmd: |
          {{.AWS_REAL}}
          cd {{.AWS_TF_DIR}}
          tofu apply -target=module.app.aws_ecr_repository.app -auto-approve
      - task: aws:images
      - task: tf:apply:aws
      - task: tf:output:aws

  smoke:aws:
    desc: "Testa o fluxo completo pela URL HTTPS (ex.: task smoke:aws PHOTO=carro.jpg)"
    vars:
      PHOTO: '{{.PHOTO | default "examples/fotos/sintetica-bra2e19.jpg"}}'
    cmds:
      - |
        URL=$(cd {{.AWS_TF_DIR}} && tofu output -raw app_url)
        bash scripts/smoke.sh "$URL" "{{.PHOTO}}"

  eval:aws:
    desc: "Envia as fotos de uma pasta com gabarito ao sistema na AWS e compara (ex.: task eval:aws DIR=examples/dataset/openalpr-br)"
    vars:
      DIR: '{{.DIR | default "examples/fotos"}}'
    cmds:
      - |
        URL=$(cd {{.AWS_TF_DIR}} && tofu output -raw app_url)
        bash scripts/eval-ocr.sh "$URL" {{.DIR}}

  ocr:local:
    desc: "Roda o OCR do worker localmente em fotos/vídeos (ex.: task ocr:local -- examples/videos)"
    cmds:
      - docker build -q -t estacionamento-worker:local ./worker
      - |
        docker run --rm --entrypoint python -e OMP_THREAD_LIMIT=1 \
          -v "$PWD/examples:/app/examples:ro" -v "$PWD/scripts/ocr_local.py:/app/ocr_local.py:ro" \
          estacionamento-worker:local ocr_local.py {{.CLI_ARGS | default "examples/fotos examples/videos"}}

  dataset:baixar:
    desc: Baixa 114 fotos reais de carros brasileiros com gabarito (OpenALPR, AGPL-3.0) para examples/dataset/openalpr-br
    cmds:
      - python3 scripts/baixar_dataset.py examples/dataset/openalpr-br

  dataset:roboflow:
    desc: "Baixa um dataset de caracteres de placa do Roboflow com gabarito (exige ROBOFLOW_API_KEY no ambiente; ex.: task dataset:roboflow N=1000)"
    vars:
      WS: '{{.WS | default "cafuringa"}}'
      PROJ: '{{.PROJ | default "placas-whmhj"}}'
      VER: '{{.VER | default "1"}}'
      N: '{{.N | default "1000"}}'
    cmds:
      - python3 scripts/baixar_roboflow.py {{.WS}} {{.PROJ}} {{.VER}} examples/dataset/roboflow-{{.WS}} --amostra {{.N}}

  dataset:sintetico:
    desc: "Gera placas sintéticas dos 4 países do Mercosul com variações em examples/dataset/sintetico (ex.: task dataset:sintetico N=400)"
    vars:
      N: '{{.N | default "200"}}'
    cmds:
      - docker build -q -t estacionamento-worker:local ./worker
      - |
        docker run --rm --entrypoint python -e OMP_THREAD_LIMIT=1 \
          -v "$PWD/examples:/app/examples" -v "$PWD/scripts/gerar_sinteticas.py:/app/gerar_sinteticas.py:ro" \
          estacionamento-worker:local gerar_sinteticas.py examples/dataset/sintetico {{.N}}

  ocr:dataset:
    desc: "Mede o OCR (OpenCV + Tesseract) em todo o dataset, listando só os erros"
    vars:
      DIRS: '{{.DIRS | default "examples/fotos examples/dataset/openalpr-br examples/dataset/sintetico"}}'
    cmds:
      - docker build -q -t estacionamento-worker:local ./worker
      - |
        docker run --rm --entrypoint python -e OMP_THREAD_LIMIT=1           -v "$PWD/examples:/app/examples:ro" -v "$PWD/scripts/ocr_local.py:/app/ocr_local.py:ro"           estacionamento-worker:local ocr_local.py --erros {{.DIRS}}

  load:aws:
    desc: "Gera carga HTTP no ALB para o vídeo de elasticidade (ex.: task load:aws MINUTES=8 CONCURRENCY=600)"
    vars:
      MINUTES: '{{.MINUTES | default "6"}}'
      CONCURRENCY: '{{.CONCURRENCY | default "600"}}'
    cmds:
      - |
        URL=$(cd {{.AWS_TF_DIR}} && tofu output -raw alb_url)
        echo "Carga em $URL/api/spots/available por {{.MINUTES}} min com {{.CONCURRENCY}} conexões"
        # O hey para sozinho em 1 milhão de respostas (~4 min a 4 mil req/s):
        # roda em rodadas de 2 min até completar o tempo pedido.
        END=$(( $(date +%s) + {{.MINUTES}} * 60 ))
        while [ "$(date +%s)" -lt "$END" ]; do
          hey -z 2m -c {{.CONCURRENCY}} "$URL/api/spots/available" | grep -E "Requests/sec|^ +\[[0-9]{3}\]"
        done

  stress:aws:
    desc: "Plano B do vídeo: ocupa 100% da CPU das instâncias atuais via SSM (ex.: task stress:aws DURATION=300)"
    vars:
      DURATION: '{{.DURATION | default "300"}}'
    cmds:
      - |
        {{.AWS_REAL}}
        aws ssm send-command --region {{.AWS_REGION_REAL}} --document-name AWS-RunShellScript \
          --targets "Key=tag:aws:autoscaling:groupName,Values={{.ASG_NAME}}" \
          --parameters '{"commands":["for i in $(seq $(nproc)); do timeout {{.DURATION}} yes > /dev/null & done; wait"]}' \
          --query 'Command.CommandId' --output text

  dev:api:
    desc: Executa a API Go em modo desenvolvimento
    dir: "{{.API_DIR}}"
    env:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      S3_ENDPOINT_URL: http://localhost:9000
      S3_BUCKET_NAME: estacionamento-fotos-veiculos-local
      DYNAMODB_ENDPOINT_URL: http://localhost:8000
      DYNAMODB_TABLE_NAME: AuditoriaEstacionamento
      RABBITMQ_URL: amqp://guest:guest@localhost:5672/
      RABBITMQ_QUEUE_NAME: ocr-processamento-fila
      DATABASE_URL: postgres://app_user:app_password@localhost:5432/estacionamento?sslmode=disable
      REDIS_URL: localhost:6379
    cmds:
      - go run ./cmd/api

  test:api:
    desc: Executa os testes unitários da API Go
    dir: "{{.API_DIR}}"
    cmds:
      - go test -v ./...

  build:api:
    desc: Compila o binário da API Go
    dir: "{{.API_DIR}}"
    cmds:
      - go build -v -o bin/api ./cmd/api

  dev:worker:
    desc: Executa o worker OCR Python em ambiente virtual
    dir: "{{.WORKER_DIR}}"
    env:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      S3_ENDPOINT_URL: http://localhost:9000
      S3_BUCKET_NAME: estacionamento-fotos-veiculos-local
      DYNAMODB_ENDPOINT_URL: http://localhost:8000
      DYNAMODB_TABLE_NAME: AuditoriaEstacionamento
      RABBITMQ_URL: amqp://guest:guest@localhost:5672/
      RABBITMQ_QUEUE_NAME: ocr-processamento-fila
      DATABASE_URL: postgresql://app_user:app_password@localhost:5432/estacionamento
    cmds:
      - uv run python worker.py

  test:worker:
    desc: Executa os testes do worker Python
    dir: "{{.WORKER_DIR}}"
    cmds:
      - uv run pytest

  install:web:
    desc: Instala as dependências do frontend a partir do package-lock.json
    dir: "{{.WEB_DIR}}"
    cmds:
      - npm ci

  dev:web:
    desc: Inicia o servidor de desenvolvimento do React/Vite
    dir: "{{.WEB_DIR}}"
    cmds:
      - npm run dev

  test:web:
    desc: Executa os testes do frontend (Vitest)
    dir: "{{.WEB_DIR}}"
    cmds:
      - npm run test -- --run

  lint:web:
    desc: Executa o linter do frontend
    dir: "{{.WEB_DIR}}"
    cmds:
      - npm run lint

  build:web:
    desc: Gera o bundle estático do frontend
    dir: "{{.WEB_DIR}}"
    cmds:
      - npm run build

  bootstrap:local:
    desc: Prepara o ambiente local completo (Sobe containers e cria bucket no RustFS + tabela no DynamoDB Local)
    cmds:
      - task: infra:up
      - echo "Ambiente local de dependências provisionado com sucesso!"
