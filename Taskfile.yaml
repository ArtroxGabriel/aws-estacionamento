version: "3"

vars:
  ENV_FILE: .env
  TERRAFORM_DIR: infra
  API_DIR: api
  WORKER_DIR: worker
  WEB_DIR: web
  DOCKER_COMPOSE_FILE: "{{.TERRAFORM_DIR}}/docker-compose.yaml"
  AWS_REGION_REAL: us-east-1
  ASG_NAME: estacionamento-asg
  # O .env aponta AWS_ENDPOINT_URL para o Floci e usa chaves falsas; o AWS CLI e
  # o provider do OpenTofu leem essas variáveis. As tasks da AWS real começam
  # com este trecho para descartá-las e usar ~/.aws/credentials (ou o ambiente).
  AWS_REAL: |
    if [ "$AWS_ACCESS_KEY_ID" = "mock_key" ]; then unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; fi
    case "$AWS_ENDPOINT_URL" in *localhost*|*127.0.0.1*|*floci*) unset AWS_ENDPOINT_URL;; esac

dotenv: [".env"]

tasks:
  default:
    desc: Lista os comandos disponíveis
    cmds:
      - task --list

  infra:up:
    desc: Sobe o container de emulação local Floci (S3, SNS, SQS, DynamoDB, RDS, ElastiCache)
    cmds:
      - docker compose -f {{.DOCKER_COMPOSE_FILE}} up -d

  infra:down:
    desc: Encerra os containers locais
    cmds:
      - docker compose -f {{.DOCKER_COMPOSE_FILE}} down

  infra:logs:
    desc: Acompanha os logs dos containers locais
    cmds:
      - docker compose -f {{.DOCKER_COMPOSE_FILE}} logs -f

  tf:clean:
    desc: Remove arquivos de estado e cache locais do OpenTofu/Terraform
    dir: "{{.TERRAFORM_DIR}}"
    cmds:
      - rm -rf .terraform .tofu .terraform.lock.hcl terraform.tfstate terraform.tfstate.backup

  infra:clean:
    desc: Remove containers, volumes, networks locais e limpa o estado do OpenTofu
    cmds:
      - docker compose -f {{.DOCKER_COMPOSE_FILE}} down -v --remove-orphans
      - task: tf:clean

  infra:clean:all:
    desc: Remove containers, volumes, networks, imagens e limpa o estado do OpenTofu
    cmds:
      - docker compose -f {{.DOCKER_COMPOSE_FILE}} down -v --remove-orphans --rmi all
      - task: tf:clean

  tf:init:
    desc: Inicializa o diretório do OpenTofu
    dir: "{{.TERRAFORM_DIR}}"
    cmds:
      - tofu init

  tf:plan:local:
    desc: Gera o plano de execução do OpenTofu apontando para o Floci
    dir: "{{.TERRAFORM_DIR}}"
    cmds:
      - tofu workspace select default
      - tofu plan -var="use_localstack=true"

  tf:plan:aws:
    desc: Gera o plano de execução do OpenTofu para a AWS (workspace "aws")
    dir: "{{.TERRAFORM_DIR}}"
    cmds:
      - |
        {{.AWS_REAL}}
        tofu workspace select -or-create aws
        tofu plan -var="use_localstack=false"

  tf:apply:local:
    desc: Provisiona recursos locais apontando para o Floci via OpenTofu
    dir: "{{.TERRAFORM_DIR}}"
    cmds:
      - tofu workspace select default
      - tofu apply -var="use_localstack=true" -auto-approve

  tf:apply:aws:
    desc: Provisiona recursos reais na AWS via OpenTofu (workspace "aws")
    dir: "{{.TERRAFORM_DIR}}"
    cmds:
      - |
        {{.AWS_REAL}}
        tofu workspace select -or-create aws
        tofu apply -var="use_localstack=false"

  tf:destroy:aws:
    desc: Destrói recursos na AWS para evitar cobrança (workspace "aws")
    dir: "{{.TERRAFORM_DIR}}"
    cmds:
      - |
        {{.AWS_REAL}}
        tofu workspace select aws
        tofu destroy -var="use_localstack=false" -auto-approve

  tf:refresh:
    desc: Atualiza o estado do OpenTofu com os recursos reais na AWS
    dir: "{{.TERRAFORM_DIR}}"
    cmds:
      - |
        {{.AWS_REAL}}
        tofu workspace select aws
        tofu refresh -var="use_localstack=false"

  tf:output:
    desc: Exibe os outputs do OpenTofu (workspace atual)
    dir: "{{.TERRAFORM_DIR}}"
    cmds:
      - tofu output

  tf:output:aws:
    desc: Exibe os outputs do OpenTofu da AWS (URL do ALB, ASG, ECR...)
    dir: "{{.TERRAFORM_DIR}}"
    cmds:
      - tofu workspace select aws
      - tofu output

  aws:images:
    desc: Build (linux/amd64) e push das imagens api, worker e web para o ECR
    cmds:
      - |
        {{.AWS_REAL}}
        # Não usa `tofu output`: o apply com -target do deploy:aws não grava outputs.
        ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
        REGISTRY="$ACCOUNT.dkr.ecr.{{.AWS_REGION_REAL}}.amazonaws.com"
        aws ecr get-login-password --region {{.AWS_REGION_REAL}} | docker login --username AWS --password-stdin "$REGISTRY"
        for app in api worker web; do
          docker buildx build --platform linux/amd64 --provenance=false -t "$REGISTRY/estacionamento-${app}:latest" --push "./${app}"
        done

  aws:rollout:
    desc: Recria as instâncias do ASG aos poucos para pegarem as imagens novas do ECR
    cmds:
      - |
        {{.AWS_REAL}}
        aws autoscaling start-instance-refresh --region {{.AWS_REGION_REAL}} \
          --auto-scaling-group-name {{.ASG_NAME}} --preferences MinHealthyPercentage=50

  deploy:aws:
    desc: Deploy completo na AWS (ECR → imagens → infraestrutura completa)
    cmds:
      - task: tf:init
      - cmd: |
          {{.AWS_REAL}}
          cd {{.TERRAFORM_DIR}}
          tofu workspace select -or-create aws
          tofu apply -var="use_localstack=false" -target=aws_ecr_repository.app -auto-approve
      - task: aws:images
      - task: tf:apply:aws
      - task: tf:output:aws

  smoke:aws:
    desc: "Testa o fluxo completo pelo ALB (ex.: task smoke:aws PHOTO=carro.jpg)"
    requires:
      vars: [PHOTO]
    cmds:
      - |
        URL=$(cd {{.TERRAFORM_DIR}} && tofu workspace select aws >/dev/null && tofu output -raw alb_url)
        bash scripts/smoke.sh "$URL" "{{.PHOTO}}"

  load:aws:
    desc: "Gera carga HTTP no ALB para o vídeo de elasticidade (ex.: task load:aws DURATION=8m CONCURRENCY=300)"
    vars:
      DURATION: '{{.DURATION | default "5m"}}'
      CONCURRENCY: '{{.CONCURRENCY | default "200"}}'
    cmds:
      - |
        URL=$(cd {{.TERRAFORM_DIR}} && tofu workspace select aws >/dev/null && tofu output -raw alb_url)
        echo "Carga em $URL/api/spots/available por {{.DURATION}} com {{.CONCURRENCY}} conexões"
        hey -z {{.DURATION}} -c {{.CONCURRENCY}} "$URL/api/spots/available"

  stress:aws:
    desc: "Plano B do vídeo: ocupa 100% da CPU das instâncias atuais via SSM (ex.: task stress:aws DURATION=300)"
    vars:
      DURATION: '{{.DURATION | default "300"}}'
    cmds:
      - |
        {{.AWS_REAL}}
        aws ssm send-command --region {{.AWS_REGION_REAL}} --document-name AWS-RunShellScript \
          --targets "Key=tag:aws:autoscaling:groupName,Values={{.ASG_NAME}}" \
          --parameters '{"commands":["for i in $(seq $(nproc)); do timeout {{.DURATION}} yes > /dev/null & done; wait"]}' \
          --query 'Command.CommandId' --output text

  dev:api:
    desc: Executa a API Go em modo desenvolvimento
    dir: "{{.API_DIR}}"
    env:
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: mock_key
      AWS_SECRET_ACCESS_KEY: mock_secret
      DATABASE_URL: postgres://app_user:app_password@localhost:5432/estacionamento?sslmode=disable
      REDIS_URL: localhost:6379
      SQS_QUEUE_URL: http://localhost:4566/000000000000/ocr-processamento-fila
    cmds:
      - go run ./cmd/api

  test:api:
    desc: Executa os testes unitários da API Go
    dir: "{{.API_DIR}}"
    cmds:
      - go test -v ./...

  build:api:
    desc: Compila o binário da API Go
    dir: "{{.API_DIR}}"
    cmds:
      - go build -v -o bin/api ./cmd/api

  dev:worker:
    desc: Executa o worker OCR Python em ambiente virtual
    dir: "{{.WORKER_DIR}}"
    env:
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: mock_key
      AWS_SECRET_ACCESS_KEY: mock_secret
      SQS_QUEUE_URL: http://localhost:4566/000000000000/ocr-processamento-fila
      DATABASE_URL: postgresql://app_user:app_password@localhost:5432/estacionamento
      REDIS_URL: redis://localhost:6379
      S3_BUCKET_NAME: estacionamento-fotos-veiculos-local
      DYNAMODB_TABLE_NAME: AuditoriaEstacionamento
    cmds:
      - uv run python worker.py

  install:web:
    desc: Instala as dependências do frontend a partir do package-lock.json
    dir: "{{.WEB_DIR}}"
    cmds:
      - npm ci

  dev:web:
    desc: Inicia o servidor de desenvolvimento do React/Vite
    dir: "{{.WEB_DIR}}"
    cmds:
      - npm run dev

  test:web:
    desc: Executa os testes do frontend (Vitest)
    dir: "{{.WEB_DIR}}"
    cmds:
      - npm run test -- --run

  lint:web:
    desc: Executa o linter do frontend
    dir: "{{.WEB_DIR}}"
    cmds:
      - npm run lint

  build:web:
    desc: Gera o bundle estático do frontend
    dir: "{{.WEB_DIR}}"
    cmds:
      - npm run build

  bootstrap:local:
    desc: Prepara o ambiente local completo (Docker + OpenTofu local)
    cmds:
      - task: infra:up
      - cmd: sleep 5
      - task: tf:init
      - task: tf:apply:local
      - echo "Ambiente local provisionado com sucesso via Floci!"
