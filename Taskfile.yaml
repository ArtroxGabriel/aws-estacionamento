version: "3"

vars:
  ENV_FILE: .env
  TERRAFORM_DIR: infra
  API_DIR: api
  WORKER_DIR: worker
  WEB_DIR: web
  DOCKER_COMPOSE_FILE: "{{.TERRAFORM_DIR}}/docker-compose.yaml"

dotenv: [".env"]

tasks:
  default:
    desc: Lista os comandos disponíveis
    cmds:
      - task --list

  infra:up:
    desc: Sobe o container de emulação local Floci (S3, SNS, SQS, DynamoDB, RDS, ElastiCache)
    cmds:
      - docker compose -f {{.DOCKER_COMPOSE_FILE}} up -d

  infra:down:
    desc: Encerra os containers locais
    cmds:
      - docker compose -f {{.DOCKER_COMPOSE_FILE}} down

  infra:logs:
    desc: Acompanha os logs dos containers locais
    cmds:
      - docker compose -f {{.DOCKER_COMPOSE_FILE}} logs -f

  tf:clean:
    desc: Remove arquivos de estado e cache locais do Terraform
    dir: "{{.TERRAFORM_DIR}}"
    cmds:
      - rm -rf .terraform .terraform.lock.hcl terraform.tfstate terraform.tfstate.backup

  infra:clean:
    desc: Remove containers, volumes, networks locais e limpa o estado do Terraform
    cmds:
      - docker compose -f {{.DOCKER_COMPOSE_FILE}} down -v --remove-orphans
      - task: tf:clean

  infra:clean:all:
    desc: Remove containers, volumes, networks, imagens e limpa o estado do Terraform
    cmds:
      - docker compose -f {{.DOCKER_COMPOSE_FILE}} down -v --remove-orphans --rmi all
      - task: tf:clean

  tf:init:
    desc: Inicializa o diretório do Terraform
    dir: "{{.TERRAFORM_DIR}}"
    cmds:
      - terraform init

  tf:plan:local:
    desc: Gera o plano de execução do Terraform apontando para o Floci
    dir: "{{.TERRAFORM_DIR}}"
    cmds:
      - terraform plan -var="use_localstack=true"

  tf:plan:aws:
    desc: Gera o plano de execução do Terraform para o AWS Academy
    dir: "{{.TERRAFORM_DIR}}"
    cmds:
      - terraform plan -var="use_localstack=false"

  tf:apply:local:
    desc: Provisiona recursos locais apontando para o Floci
    dir: "{{.TERRAFORM_DIR}}"
    cmds:
      - terraform apply -var="use_localstack=true" -auto-approve

  tf:apply:aws:
    desc: Provisiona recursos reais no AWS Academy
    dir: "{{.TERRAFORM_DIR}}"
    cmds:
      - terraform apply -var="use_localstack=false"

  tf:destroy:aws:
    desc: Destrói recursos no AWS Academy para evitar cobrança de créditos
    dir: "{{.TERRAFORM_DIR}}"
    cmds:
      - terraform destroy -var="use_localstack=false" -auto-approve

  tf:refresh:
    desc: Atualiza o estado do Terraform com os recursos reais no AWS Academy
    dir: "{{.TERRAFORM_DIR}}"
    cmds:
      - terraform refresh -var="use_localstack=false"

  tf:output:
    desc: Exibe os outputs do Terraform
    dir: "{{.TERRAFORM_DIR}}"
    cmds:
      - terraform output

  dev:api:
    desc: Executa a API Go em modo desenvolvimento
    dir: "{{.API_DIR}}"
    env:
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: mock_key
      AWS_SECRET_ACCESS_KEY: mock_secret
      DATABASE_URL: postgres://app_user:app_password@localhost:5432/estacionamento?sslmode=disable
      REDIS_URL: localhost:6379
      SNS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:novo-veiculo-topico
    cmds:
      - go run ./cmd/api

  test:api:
    desc: Executa os testes unitários da API Go
    dir: "{{.API_DIR}}"
    cmds:
      - go test -v ./...

  build:api:
    desc: Compila o binário da API Go
    dir: "{{.API_DIR}}"
    cmds:
      - go build -v -o bin/api ./cmd/api

  dev:worker:
    desc: Executa o worker OCR Python em ambiente virtual
    dir: "{{.WORKER_DIR}}"
    env:
      AWS_ENDPOINT_URL: http://localhost:4566
      DATABASE_URL: postgresql://app_user:app_password@localhost:5432/estacionamento
    cmds:
      - python3 worker.py

  dev:web:
    desc: Inicia o servidor de desenvolvimento do React/Vite
    dir: "{{.WEB_DIR}}"
    cmds:
      - npm run dev

  build:web:
    desc: Gera o bundle estático do frontend
    dir: "{{.WEB_DIR}}"
    cmds:
      - npm run build

  bootstrap:local:
    desc: Prepara o ambiente local completo (Docker + Terraform local)
    cmds:
      - task: infra:up
      - cmd: sleep 5
      - task: tf:init
      - task: tf:apply:local
      - echo "Ambiente local provisionado com sucesso via Floci!"
